# Dogfooding: run FlakeHerd on FlakeHerd's own test suite.
#
# STATUS: experimental. This workflow exercises the composite action against
# this repository itself. It has not been validated on real GitHub-hosted
# runners yet (maintainer note at time of writing: 2026-10); the underlying
# commands are covered by the automated test suite. Run it manually first
# and check the results before relying on it.
name: Dogfood

on:
  workflow_dispatch: {}

permissions:
  contents: write  # needed to push history to the cache branch

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run tests with a JUnit XML report
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install FlakeHerd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q --junitxml=junit.xml
        continue-on-error: true  # let FlakeHerd triage the failures instead

      - name: FlakeHerd (this repo's own action)
        uses: ./          # local action; switch to you/flakeherd@v1 style once public
        with:
          junit-glob: 'junit.xml'
          fail-on: 'never' # never fails here; we are only collecting evidence
          history-branch: 'flakeherd/history'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          quarantine: 'true'
