[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeherd"
description = "History-aware flaky-test detection and quarantine for GitHub Actions. JUnit-XML universal, in-repo SQLite history, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FlakeHerd contributors" }]
keywords = ["flaky-tests", "ci", "github-actions", "junit", "testing", "quarantine", "test-reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []  # intentional: flakeherd is pure standard library
dynamic = ["version"]


[project.scripts]
flakeherd = "flakeherd.cli:main"

[project.entry-points.pytest11]
flakeherd = "flakeherd.pytest_plugin"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakeherd = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "flakeherd.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "UP007",  # keep Optional[] / Union[] for Python 3.9 compatibility
    "UP045",
    "RUF001", # ambiguous unicode in docstrings is fine
    "RUF002",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
